<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>茨城旅行 in 2026</title>
    <style>
        :root {
            --primary-color: #2c7a7b;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #e2e8f0;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px 15px;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 1.75rem;
            color: var(--primary-color);
            margin: 0;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary-color);
            display: inline-block;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
        }

        .card h2 {
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
        }

        .info-highlight {
            font-size: 1.1rem;
            font-weight: bold;
            color: #c53030;
            margin: 8px 0;
        }

        /* 経路のルート表示 */
        .route-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: #edf2f7;
            padding: 14px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.05rem;
        }

        .route-arrow {
            color: var(--primary-color);
            font-size: 1.2rem;
        }

        /* マップのレスポンシブ対応 */
        .map-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 比率 */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            margin: 15px 0;
        }

        .map-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* 持ち物リストのデザイン */
        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }

        .item-list li {
            background-color: #edf2f7;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .item-list li::before {
            content: "✔";
            color: var(--primary-color);
            margin-right: 6px;
            font-weight: bold;
        }

        .price {
            font-size: 1.4rem;
            font-weight: bold;
            color: #2b6cb0;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>茨城旅行 in 2026</h1>
        </header>

        <!-- 集合場所 -->
        <section class="card">
            <h2>集合場所</h2>
            <p><strong>セブン-イレブン 三郷茂田井店</strong><br>
            〒341-0025 埼玉県三郷市茂田井４０４−１</p>

            <div class="map-wrapper">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3234.246072347331!2d139.8767330756209!3d35.84296927253549!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x60189a5f3d73aba3%3A0xc6289b25901b9632!2z44K744OW44OzLeOCpOODrOODluODsyDkuInpg7fojILnlLDkupXlupc!5e0!3m2!1sja!2sjp!4v1789120576470!5m2!1sja!2sjp" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <p>JR三郷駅から徒歩約10分</p>
            <p class="info-highlight">集合時間：11:30</p>
        </section>

        <!-- 経路 & 目的地 -->
        <section class="card">
            <h2>移動・目的地</h2>
            <p><strong>【予定経路】</strong></p>
            <div class="route-box">
                <span>三郷スマートIC</span>
                <span class="route-arrow">➔</span>
                <span>水戸北IC</span>
            </div>
            <p style="margin-top: 18px; margin-bottom: 6px;"><strong>【目的地】</strong></p>
            <p style="margin: 0; font-size: 1.05rem;">
                <strong>大子広域公園オートキャンプ場グリンヴィラ</strong><br>
                <span style="font-size: 0.9rem; color: #718096;">茨城県久慈郡大子町矢田15-1</span>
            </p>
        </section>

        <!-- 持ち物 -->
        <section class="card">
            <h2>持ち物</h2>
            <ul class="item-list">
                <li>バスタオル</li>
                <li>歯ブラシ</li>
                <li>洗髪材</li>
                <li>キャンプ用品</li>
                <li>充電器</li>
                <li>着替え</li>
                <li>雨具</li>
                <li>薬 (必要なら)</li>
                <li>その他</li>
            </ul>
        </section>

        <!-- 必要金額 -->
        <section class="card">
            <h2>今回の必要金額</h2>
            <p class="price">約 10,000 円</p>
        </section>
    </div>

</body>
</html>
