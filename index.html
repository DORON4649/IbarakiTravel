<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>茨城旅行 in 2026</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>茨城旅行 in 2026</h1>
        </header>

        <section class="card">
            <h2>集合場所</h2>
            <p><strong>セブン-イレブン 三郷茂田井店</strong><br>
            〒341-0025 埼玉県三郷市茂田井４０４−１</p>

            <div class="map-wrapper">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3234.246072347331!2d139.8767330756209!3d35.84296927253549!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x60189a5f3d73aba3%3A0xc6289b25901b9632!2z44K744OW44OzLeOCpOODrOODluODsyDkuInpg7fojILnlLDkupXlupc!5e0!3m2!1sja!2sjp!4v1789120576470!5m2!1sja!2sjp" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <p>JR三郷駅から徒歩約10分</p>
            <p class="info-highlight">集合時間：11:30</p>
        </section>

        <section class="card">
            <h2>移動・目的地</h2>
            <p><strong>【予定経路】</strong></p>
            <div class="route-box">
                <span>三郷スマートIC</span>
                <span class="route-arrow">➔</span>
                <span>水戸北IC</span>
            </div>
            <p class="dest-label"><strong>【目的地】</strong></p>
            <p class="dest-text">
                <strong>大子広域公園オートキャンプ場グリンヴィラ</strong><br>
                <span class="dest-sub">茨城県久慈郡大子町矢田15-1</span>
            </p>
            <div class="map-wrapper">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3194.9526367089047!2d140.34499247566637!3d36.7956859722484!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6021c0aab01f673d%3A0x6a489eaaa4ef9bdb!2z5aSn5a2Q5bqD5Z-f5YWs5ZyS44Kq44O844OI44Kt44Oj44Oz44OX5aC044Kw44Oq44Oz44O044Kj44Op!5e0!3m2!1sja!2sjp!4v1789130065113!5m2!1sja!2sjp" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
        </section>

        <section class="card">
            <h2>持ち物</h2>
            <ul class="item-list">
                <li>バスタオル</li>
                <li>歯ブラシ</li>
                <li>洗髪材</li>
                <li>キャンプ用品</li>
                <li>充電器</li>
                <li>着替え</li>
                <li>雨具</li>
                <li>薬 (必要なら)</li>
                <li>その他</li>
            </ul>
        </section>

        <section class="card">
            <h2>今回の必要金額</h2>
            <p class="price">約 10,000 円</p>
        </section>
    </div>

</body>
</html>
